line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "venv",
    "Python",
    ".tmp",
    "**/Python/**",
]

[lint]
select = ["E", "F", "I", "PIE", "PLW", "RUF"]
ignore = [
    "E501",
    "F841",
    "I001",
    "S110",
    "BLE001",
    "F401",
    "E402",
    "PIE810",
    "PLW1510",
    "E401",
    "E741",
    "RUF013",
    "RUF059",
    "PLW0603",
    "RUF002",
    "RUF005",
    "PLW0108",
    "RUF001",
    "RUF003",
    "RUF012",
    "PLW2901",
    "F601",
    "E701",
    "E702",
    "RUF006",
    "RUF043",
    "PLW1508",
    "PLW0602",
    "F811",
    "F402",
    "PLW1509",
    "RUF034",
    "F821",
    "RUF100",
]

[lint.isort]
known-first-party = ["zqm"]
